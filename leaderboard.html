<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRYHOLE - Leaderboard</title>
<style>
:root{
  --bg:#0D1110; --panel:#121815; --panel2:#1B211D; --line:#293128;
  --lime:#B8FF00; --text:#E8ECE5; --mute:#7B847C;
  --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --side:264px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--lime);outline-offset:2px}
.mono{font-family:var(--mono)}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}

/* Sidebar */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:28px 18px 20px;z-index:30;transition:transform .25s ease}
.brand{padding:0 8px 22px;border-bottom:1px solid var(--line)}
.brand b{display:block;font-size:22px;font-weight:700;letter-spacing:.22em}
.brand span{display:block;margin-top:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.3em;color:var(--mute)}
.ws{padding:24px 8px 10px}
nav{display:flex;flex-direction:column;gap:4px}
.nav{display:flex;align-items:center;gap:14px;padding:11px 12px;border:1px solid transparent;border-radius:3px;color:var(--mute);font-size:14px;letter-spacing:.02em;transition:color .15s,background .15s,border-color .15s}
.nav .ic{width:18px;text-align:center;font-size:15px;font-family:var(--mono)}
.nav .dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:transparent}
.nav:hover{color:var(--text);background:var(--panel2)}
.nav.active{color:var(--lime);background:#152016;border-color:rgba(184,255,0,.45);box-shadow:0 0 18px rgba(184,255,0,.08),inset 0 0 12px rgba(184,255,0,.04)}
.nav.active .dot{background:var(--lime);box-shadow:0 0 8px var(--lime)}
.note{margin-top:auto;border:1px solid var(--line);border-radius:3px;padding:16px;background:var(--bg)}
.note p{margin-top:12px;font-size:15px;line-height:1.45;color:var(--text)}
.note p i{display:block;color:var(--mute);font-style:normal}
.note .tick{margin-top:14px;height:1px;background:var(--line);position:relative}
.note .tick:after{content:"";position:absolute;left:0;top:-1px;width:28px;height:3px;background:var(--lime)}

/* Top bar (mobile) */
.top{display:none}
.scrim{display:none}

/* Main */
main{margin-left:var(--side);padding:32px 48px 64px;max-width:1240px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px}
.ph{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.live{display:inline-flex;align-items:center;gap:8px;color:var(--lime)}
.live:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime)}
.sec{margin-top:56px}

/* Content header (all pages) + Home tabs */
.mh{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.tlinks{display:flex;flex-direction:row;align-items:center;gap:16px}
.tlinks a{display:inline-flex;align-items:center;gap:6px;color:var(--text,inherit);text-decoration:none}
.mh-title{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.24em;text-transform:uppercase}
.wallet{display:block;width:100%;margin-top:12px;text-align:center;padding:13px 18px;border:1px solid rgba(184,255,0,.45);border-radius:3px;background:#152016;color:var(--lime);font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;transition:background .15s,color .15s}
.wallet:hover{background:var(--lime);color:var(--bg)}
.pg-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.pg-head h1{margin-top:12px;font-size:clamp(30px,4vw,48px);line-height:1.04;font-weight:600;letter-spacing:-.02em}
.pg-head p{max-width:360px;font-size:14px;line-height:1.6;color:var(--mute)}
@media (max-width:860px){
  .side{transform:translateX(-100%);width:min(300px,86vw);box-shadow:none}
  body.open .side{transform:none;box-shadow:24px 0 60px rgba(0,0,0,.6)}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
  body.open .scrim{opacity:1;pointer-events:auto}
  .top{display:flex;position:sticky;top:0;z-index:10;align-items:center;gap:14px;padding:12px 16px;background:rgba(13,17,16,.94);border-bottom:1px solid var(--line)}
  .burger{width:40px;height:40px;border:1px solid var(--line);border-radius:3px;display:grid;place-content:center;gap:5px}
  .burger i{display:block;width:18px;height:1px;background:var(--text)}
  .top b{font-size:15px;letter-spacing:.22em}
  .top .tlinks{margin-left:auto}
  .mh-links{display:none}
  main{margin-left:0;padding:24px 18px 48px}
}

/* ===== LEADERBOARD module ===== */
.pages{margin-top:28px}
.tabs{display:flex;justify-content:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.tab{padding:11px 20px;border:1px solid var(--line);border-radius:3px;font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);transition:color .15s,background .15s,border-color .15s}
.tab:hover{color:var(--text);background:var(--panel2)}
.tab[aria-selected="true"]{color:var(--lime);background:#152016;border-color:rgba(184,255,0,.45);box-shadow:0 0 18px rgba(184,255,0,.08),inset 0 0 12px rgba(184,255,0,.04)}
.pager{display:flex;gap:8px;padding:18px}
.pgb{min-width:36px;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--mute);font-family:var(--mono);font-size:12px;letter-spacing:.1em;transition:border-color .15s,color .15s,background .15s}
.pgb:hover{border-color:var(--lime);color:var(--lime)}
.pgb.on{border-color:var(--lime);background:#152016;color:var(--lime)}
.pgb:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line);color:var(--mute)}
.lb{width:100%}
.lbh,.lbr{display:grid;grid-template-columns:90px minmax(0,1fr) 160px;gap:16px;align-items:center;padding:13px 18px}
.lbh{border-bottom:1px solid var(--line);background:var(--bg)}
.lbr{border-top:1px solid var(--line);font-family:var(--mono);font-size:13px;letter-spacing:.1em}
.lbr:first-child{border-top:0}
.lbr .c2,.lbh .c2{text-align:left}
.lbr .c2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbr .c3,.lbh .c3{text-align:right}
.lbr .dim{color:var(--mute)}
.lbr.top1 .c1{color:var(--lime)}
@media (max-width:480px){.lbh,.lbr{grid-template-columns:48px minmax(0,1fr) 90px;gap:10px;padding:13px 14px}.tabs{padding:12px 14px}.tab{padding:10px 14px}}
</style>
</head>
<body>
<header class="top">
  <button class="burger" id="open" aria-label="Open menu" aria-controls="side"><i></i><i></i><i></i></button>
  <b>DRYHOLE</b>
  <nav class="tlinks" aria-label="Links">
    <a class="label" href="https://x.com/dryholedrill" target="_blank" rel="noopener" aria-label="X"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a>
    <a class="label" href="docs.html">Docs</a>
  </nav>
</header>
<div class="scrim" id="scrim"></div>

<aside class="side" id="side">
  <div class="brand"><b>DRYHOLE</b></div>
  <div class="ws label">Workspace</div>
  <nav id="nav">
    <a class="nav" href="index.html"><span class="ic">&#9638;</span>Home<i class="dot"></i></a>
    <a class="nav" href="genesis.html"><span class="ic">&#9672;</span>Genesis<i class="dot"></i></a>
    <a class="nav" href="drill.html"><span class="ic">&#9935;&#xFE0E;</span>Drill<i class="dot"></i></a>
    <div class="ws label">Economy</div>
    <a class="nav" href="swap.html"><span class="ic">&#8644;</span>Swap<i class="dot"></i></a>
    <a class="nav" href="stake.html"><span class="ic">&#9678;</span>Stake<i class="dot"></i></a>
    <a class="nav" href="burn.html"><span class="ic">&#9650;</span>Burn<i class="dot"></i></a>
    <a class="nav" href="market.html"><span class="ic">&#9637;</span>Market<i class="dot"></i></a>
    <a class="nav active" href="leaderboard.html" aria-current="page"><span class="ic">&#9776;</span>Leaderboard<i class="dot"></i></a>
  </nav>
  <div class="note">
    <div class="label">The Dryhole Network</div>
    <p>Find something.<i>Or find nothing.</i></p>
    <div class="tick"></div>
  </div>
  <button class="wallet" type="button">Connect Wallet</button>
</aside>


<main>
  <header class="mh">
    <div class="mh-title">Dryhole &gt; Leaderboard</div>
    <nav class="tlinks mh-links" aria-label="Links">
    <a class="label" href="https://x.com/dryholedrill" target="_blank" rel="noopener" aria-label="X"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a>
    <a class="label" href="docs.html">Docs</a>
    </nav>
  </header>

  <div class="pages">
    <section class="panel">
      <div class="tabs" role="tablist" aria-label="Leaderboard">
        <button class="tab" type="button" role="tab" id="tab-dryhole" aria-selected="true" aria-controls="lb-dryhole" data-t="dryhole">Dryhole</button>
        <button class="tab" type="button" role="tab" id="tab-genesis" aria-selected="false" aria-controls="lb-genesis" data-t="genesis">Genesis</button>
      </div>
      <div class="lb" id="lb-dryhole" role="tabpanel" aria-labelledby="tab-dryhole">
        <div class="lbh label"><span>Rank</span><span class="c2">Wallet</span><span class="c3">Points</span></div>
        <div id="rows-dryhole"></div>
      </div>
      <div class="lb" id="lb-genesis" role="tabpanel" aria-labelledby="tab-genesis" hidden>
        <div class="lbh label"><span>Rank</span><span class="c2">Wallet</span><span class="c3">Points</span></div>
        <div id="rows-genesis"></div>
      </div>
      <div class="pager" id="pager" role="navigation" aria-label="Leaderboard pages">
        <button class="pgb on" type="button" data-p="1" aria-current="page">1</button>
        <button class="pgb" type="button" data-p="2">2</button>
        <button class="pgb" type="button" data-p="3">3</button>
        <button class="pgb" type="button" id="pgNext" aria-label="Next page">&rsaquo;</button>
      </div>
    </section>
  </div>
</main>
<script>
(function(){
  var b=document.body;
  function drawer(o){b.classList.toggle('open',o)}
  document.getElementById('open').addEventListener('click',function(){drawer(true)});
  document.getElementById('scrim').addEventListener('click',function(){drawer(false)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')drawer(false)});
  document.querySelectorAll('#nav a').forEach(function(a){a.addEventListener('click',function(){drawer(false)})});
  window.addEventListener('pageshow',function(){drawer(false)});

  /* ===== Leaderboard ===== */
  var ROWS=10,PAGES=3,page={dryhole:1,genesis:1},cur='dryhole';
  /* Entries: [wallet, points]. Empty until real data is wired in. */
  var DATA={dryhole:[],genesis:[]};
  function esc(v){return String(v).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function render(k){
    var l=DATA[k],h='';
    for(var i=0;i<ROWS;i++){
      var n=(page[k]-1)*ROWS+i,e=l[n],w=e?e[0]:'-',p=e?e[1]:'-';
      h+='<div class="lbr'+(n===0&&e?' top1':'')+'"><span class="c1">'+(n+1)+'</span><span class="c2'+(e?'':' dim')+'">'+esc(w)+'</span><span class="c3'+(e?'':' dim')+'">'+esc(p)+'</span></div>';
    }
    document.getElementById('rows-'+k).innerHTML=h;
  }
  function renderPager(){
    var pg=page[cur];
    [].forEach.call(document.querySelectorAll('.pgb[data-p]'),function(x){
      var on=+x.getAttribute('data-p')===pg;
      x.classList.toggle('on',on);
      if(on)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current');
    });
    document.getElementById('pgNext').disabled=pg>=PAGES;
  }
  function show(k){
    cur=k;
    ['dryhole','genesis'].forEach(function(t){
      var on=t===k;
      document.getElementById('tab-'+t).setAttribute('aria-selected',on?'true':'false');
      document.getElementById('lb-'+t).hidden=!on;
    });
    renderPager();
  }
  document.addEventListener('click',function(e){
    var t=e.target.closest&&e.target.closest('.tab');
    if(t){show(t.getAttribute('data-t'));return}
    var b=e.target.closest&&e.target.closest('.pgb');
    if(b&&!b.disabled){
      page[cur]=b.id==='pgNext'?Math.min(PAGES,page[cur]+1):+b.getAttribute('data-p');
      render(cur);renderPager();
    }
  });
  render('dryhole');render('genesis');renderPager();
})();
</script>
<script type="module" src="wallet.js"></script>
</body>
</html>
